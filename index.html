<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Vendas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Painel de Vendas</h1>
        <p>Filtre, ordene e analise as vendas em tempo real.</p>
      </header>

      <section class="controls">
        <input id="searchInput" type="text" placeholder="Buscar por cliente ou produto" />

        <select id="statusFilter">
          <option value="all">Todos os status</option>
          <option value="Pago">Pago</option>
          <option value="Pendente">Pendente</option>
          <option value="Cancelado">Cancelado</option>
        </select>

        <select id="sortBy">
          <option value="date-desc">Data (mais recente)</option>
          <option value="date-asc">Data (mais antiga)</option>
          <option value="value-desc">Valor (maior)</option>
          <option value="value-asc">Valor (menor)</option>
        </select>
      </section>

      <section class="summary" id="summaryCards"></section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Produto</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="salesTableBody"></tbody>
        </table>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
